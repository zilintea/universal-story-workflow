# 风格档案：白狐风 · 新中式角色插画（完整提示词合集，v3.4 新增，v3.6 改版）
# 来源：独立 Skill ~/workspace/custom-skills/whitefox-style/（2026-11-05 反推自 Mady Yang 视频 + 用户参考图，
# 5 轮视频测试 + 8 张抽卡定型；2026-11-06 用户找到风格名“新中式角色插画”）。
# 本文件是该 Skill 提示词的整合版：风格块 + 人物构成块 + 群像块 + 场景槽 + 8 张比例卡 + 图/视频拼装模板，
# 全部收进这一个文件。原独立 Skill 本身已冻结，本文件只进本仓库，不改原 Skill。
# 例外说明：本卡不是 styles/README.md 说的“5 行小卡”，而是一套完整提示词——白狐风的画风抓不住只靠 5 行描述，
# 必须带人物构成、群像、场景槽和比例卡才能复现，故破例整合成一张大卡。
# 触发（仅显式调用）：只有用户说出 白狐风 / 白狐风格 / 现代水墨重彩 / 新中式角色插画（或“用白狐风 Skill”）时才用本卡；
# 没说触发词时绝不套用，也不进 scripts/suggest_style.py 的自动建议。
# 工作流（v3.6）：出图不用抽卡，直接按提示词出图；出视频时以生成的图为参考图。比例仍从下面 proportions 里挑一个（随机或用户指定），只写进提示词，不再配参考图；比例卡保留作可选参考。
# 文字规则（v3.6）：画面内文字可以用汉字（春联、牌匾、灯笼字等），按场景需要出现；只许汉字，不许其他语言字母；字要写对，不许乱码错字。与 v3.3 通则一致。
# 构图规则（v3.6）：构图按场景走——场景需要多少元素就画多少，不硬凑留白，也不硬塞；空天、地面、房子、人物按场景的实际需要留，不再锁死“空天占半幅以上、一屋一树”。
# 只管画面：本卡只定画面风格，不管故事、剧本、时长、分镜——那些仍走通用故事工作流；被触发时两者配合，风格以本卡为准。
id: whitefox
alias: 白狐风（简称）/ 新中式角色插画
desc_zh: "新中式角色插画：修长人物、无脸或弱五官、书写性线条、水粉笔刷、扁平透视；简笔画主体人物（极简五官、单色或纹样长袍）、蓬松白兽、徽派白墙黑瓦；构图按场景走，画面内文字可用汉字"
triggers:
  - 白狐风
  - 白狐风格
  - 现代水墨重彩
  - 新中式角色插画

# prompt 栏 = 风格块（固定，不含场景——场景另写 scene 槽）。通用流程只读 prompt 栏时，仍能拿到风格主体。
prompt: "New Chinese-style character illustration, painterly gouache: opaque paint applied with a brush, visible dry-brush strokes and a hand-painted texture, thin fluid calligraphic strokes, flattened painterly perspective. Elongated slender figures with faceless or barely-suggested features, identity carried by a clean silhouette, a hint of an eye and a few key shapes; robe folds, hair strands and poses drift with rhythm. The colors are clean and opaque, not transparent watercolor, not bleeding, not blotchy, not flat vector color blocks. The sky is a flat pale blue with a subtle brushed texture, the ground is a flat band, robes and buildings are opaque flat colors with visible brush strokes. Only three things are soft: the hanging willow foliage (feathery vertical strands), the beast's tail dissolving into a white cloud, and the soft edge of the beast's white fur. Low-saturation base of white, grey-green and pale blue, accented with orange-red and vermilion lanterns. Composition follows the scene: as much sky, ground and negative space as the scene needs, no forced emptiness and no forced fullness; the number of houses, trees and figures follows the scene. Chinese characters may appear where the scene calls for them (couplets, plaques, lanterns), written correctly in Chinese; no letters of any other language, no garbled or misspelled characters."

# 人物构成块（画面有人物时用，原样拼在 {内容} 的人物描述后）。
# 整个人约 5 个扁平色块：小圆脸侧面（一点小眼睛 + 鼻线微凸，其余全空白，无嘴、无眉；近景眼睛是一条闭眼弯线，女子脸可带一点粉色腮红）、
# 黑发/黑帽 + 随机头饰（见下面 head_ornaments 池，不许默认两条黑飘带）、极长单色或纹样竖直袍（占全身三分之二以上，袍下露白底裙 + 白鞋）、可选小布袋/细杖。
# 别写 "no eyes, no nose, no mouth"——那会把眼睛点也抹掉；别写 "blank face" 一笔带过。
character_block: "a very tall, extremely slender figure drawn with minimal strokes, as if sketched in five flat shapes: a small round head in profile with a single tiny eye dot and a slight nose line, otherwise completely blank, no mouth, no eyebrows; black hair in a high topknot {头饰}; one long vertical robe, a single flat trapezoid reaching almost to the ground, slightly flared at the hem, solid-colored or with a traditional Chinese textile pattern (cloud, flower), with a white under-skirt and white shoes showing below"
character_variants:
  # 男子：把高髻换成高平黑帽。
  male_cap: "a tall flat black scholar's cap {头饰}"
  # 繁复发髻（image-15）：把高髻换成大髻 + 金饰；长垂带是头饰池里的一项，不是默认。
  elaborate_bun: "an elaborate tall black bun with gold ornaments {头饰}"
  # 袍面纹样（image-15）：单色时写 solid-colored；带纹样时按实际纹样换下面这句。
  patterned_robe: "with a traditional Chinese textile pattern (gold cloud pattern on orange, white and orange flowers on blue)"
  # 动物脸不变：仍是下面这句（动物不画眼睛点）。
  animal_face: "almost no facial features, only a tiny orange nose dot"

# 头饰 {头饰}（变量，每次抽一个；用户指定了就用指定的）。
# 默认每次随机抽一个，连续多张要换着抽，别张张一样；两条黑飘带只是池子里的一项，不是默认。
# 只许黑、金、银、玉、红这几种素色，画法跟整体一样扁平极简，不许画成写实精致首饰。
head_ornaments:
  - "two long thin black ribbons trailing behind"
  - "a single slim silver hairpin"
  - "a small gold ornament with one short dangling ribbon"
  - "a slim jade hairpin"
  - "a thin black cloth band"
  - "a small sprig of plum blossom tucked in the hair"
  - "a red cord with a tiny bead"
  - "no ornament at all, just the black hair / cap"

# 饰品物件（变量，用户指定了就用指定的，没指定就随机抽或不画）。
# 簪子、耳饰、腰带、布袋、细杖、牵绳、灯笼、篮子……都按本风格画：扁平单色块、极简线条、水粉笔刷，
# 不许写实精致，不许宝石光泽、金属反光、繁复雕花。物件不是固定搭配，别给每个人默认配同一件。

# 群像块（多人场景时用）。多人不许长一样：只写 "a group of people" 模型会把同一个人复制粘贴一排。
# 必须列出 4–6 个各不相同的人，每人一句话（袍色 + 发式 + 身高 + 姿态）；人数少时（2–3 人）也一样，每人各不相同。
# 围观构图：人围成半圈或一圈，面向中心，疏密不一，别排成等距的一排。
crowd_block: "the onlookers are all different people, never identical: a tall man in a red robe pointing at the center, a short old man with a white beard in a grey robe leaning on a cane, a young woman in a green robe holding a basket, a small child in a blue robe jumping up, a stout man in a tan robe with arms crossed, an old woman in a brown robe, each with a different hat or hairstyle, different heights, different poses"

# 场景槽（每次必写，二选一）。场景是变量，不是锁定项。
# 用户指定了场景：把用户说的场景写成同样格式的一句英文，只写用户说的元素 + 必要的地面天空，不许再出现默认的白墙黑瓦房子。
# 用户没指定场景：写下面默认徽派句。
scene_default: "White Huizhou walls and dark green tile roofs, red lanterns, soft washed trees dissolving into the sky, pale blue sky, flat green ground."
scene_example_garden: "a quiet garden with flowering branches, a low white garden wall, a stone path, pale blue sky, flat green ground, only a few flowering trees"

# 比例表（8 个已验证，图在 data/styles/whitefox/card_<id>.webp）。
# 比例只管身形，不管物种——比例和动物是两个独立变量，比例表里的动物只是示例。
# 用户细说比例时按描述新建一条，格式相同；用户说随机时掷 1–8 抽一张；一次生成只用一个比例，不混用。
# v3.6：出图不用抽卡，比例只写进提示词；比例卡保留作可选参考。
# 动物不固定：用户指定了就用指定的；用户没指定就随机生成一个（不默认狐狸）；随机出的动物仍套用本风格（蓬松白毛、抽象极简脸）。
proportions:
  - id: A
    name: 小头大身子短脚
    fragment: "a giant fluffy white beast with a tiny head, a huge round body like a giant cotton ball, and very short stubby legs barely visible under the fur"
    ref: data/styles/whitefox/card_a.webp
  - id: B
    name: 头身相连
    fragment: "a giant fluffy white beast whose tiny head grows directly out of its huge round body with no neck at all, short legs, the whole animal one soft abstract blob of white fur"
    ref: data/styles/whitefox/card_b.webp
  - id: C
    name: 长身子小头短脚
    fragment: "an extremely long-bodied fluffy white beast, tiny head at the front end, very short legs, long soft fur"
    ref: data/styles/whitefox/card_c.webp
  - id: D
    name: 云朵身子
    fragment: "a giant fluffy white beast shaped like a soft cloud, its tiny head peeking out from the front of the fur, legs almost completely hidden under the long fluffy fur"
    ref: data/styles/whitefox/card_d.webp
  - id: E
    name: 拉长身子
    fragment: "an extremely elongated fluffy white beast, tiny head, very long slender body, short legs, long soft fur"
    ref: data/styles/whitefox/card_e.webp
  - id: F
    name: 大头短身
    fragment: "a fluffy white beast with a big round head and a short compact round body, like a chibi beast, very short legs"
    ref: data/styles/whitefox/card_f.webp
  - id: G
    name: 人大动物小
    fragment: "a big tall person in an orange robe with a small round head in profile, a single tiny eye dot and a slight nose line, otherwise completely blank, and a black hat, walking beside a tiny fluffy white beast, about knee-high to the person, the little beast trotting at their feet"
    ref: data/styles/whitefox/card_g.webp
  - id: H
    name: 大头长身子
    fragment: "a fluffy white beast with a big round head and a very long body, short legs, long soft fur"
    ref: data/styles/whitefox/card_h.webp

# 拼装模板（{内容} = 这一镜/这一段要画的事；{比例 fragment} 从上面 proportions 里取；{场景} 按 scene 规则写）。
# 图片（v3.6）：不用抽卡、不用参考图，直接按提示词出图；一次最多 4 张（工具上限），每张一个比例。
image_template: "{比例 fragment} {内容}. {人物构成块（有人物时）} {群像块（多人时）} {场景} {风格块} Wide 16:9 composition."
# 视频：参考图用生成的图（不再是抽中的卡）；10 秒一段；动作只写一种：缓慢走、漂浮、骑行。
video_template: "Continue from this exact frame. {比例 fragment} {内容}. {人物构成块（有人物时）} {群像块（多人时）} {场景} {风格块} Slow horizontal pan, quiet dreamy folk-tale mood."

# 已知的模型顽固点（别再踩）。
# 牌匾春联上的字爱写崩：字要写对才算过，乱码错字不通过；汉字现在是允许的，写对才是标准。构图按场景走，不再硬性要求空天占上三分之二。
# 人脸爱往细了画：必须写死极简五官（见 character_block），别写 "no eyes, no nose, no mouth"。
# 兽爱往写实画（腿、鬃毛、肌肉线条）：必须写 "soft abstract shape"、animal_face 那句。
# 水彩过重 / 色块过平两个极端都错：原片是水粉笔刷——不透明颜料 + 可见干笔笔触 + 扁平透视；必须写 "painterly gouache, visible dry-brush strokes, opaque colors"，并写 "not transparent watercolor, not flat vector color blocks"。
# 软的只有三处：垂柳、兽尾白云、兽毛边缘；其余天空、地面、建筑、袍子、人物全部实色硬边。
# 验收：抽 0.5 秒 / 5 秒 / 9.9 秒三帧，对照检查——比例对不对、笔刷虚实对不对、人物构成对不对（5 个扁平色块、长袍占全身三分之二、脸是极简五官）、
# 群像人物是不是各不相同、场景对不对（用户指定的场景有没有落地、默认的房子有没有不该出现）、构图是不是按场景走（该空的空、该满的满）、画面内文字是不是汉字、有没有乱码错字、配色对不对。
# 哪项 miss 就点名那一项重出，不整体改写提示词。
